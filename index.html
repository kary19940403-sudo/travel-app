<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>旅伴手帳</title>
<meta name="theme-color" content="#d7e8f8">
<style>[hidden]:not([hidden=until-found i]){display:none!important}html{scroll-padding-top:env(safe-area-inset-top,0px)}img{max-width:100%}html.solo [data-act="join-code"]{display:none!important}</style>
</head>
<body>


<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=DM+Mono:wght@400;500&display=swap">
<style>
/* Layout: one column, bottom tab bar (行程 / 行李 / 記帳 / 設定), every form opens as a bottom sheet.
   Signature: boarding-pass cards with a perforated stub that carries the room code. */
:root{
  --bg:#d7e8f8; --surface:#ffffff; --surface2:#e8f1fa; --ink:#2f3a5c; --muted:#52607f; --line:#c3d6ea;
  --accent:#6a54b0; --accent-ink:#ffffff; --accent-soft:#e4e6fa; --accent2:#c9608a;
  --c1:#f4a6bd; --c2:#f6d77a; --c3:#a8d8a0; --c4:#9fcdf0; --c5:#f7b999; --c6:#c0b0ec;
  --warn:#9a6212; --warn-soft:#fdf0d2; --good:#2f8a5f; --bad:#c4455f; --bad-soft:#fde4ea;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-mono:"DM Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:12px; --tab-h:58px; --shadow:0 1px 2px rgba(70,110,160,.10),0 6px 16px rgba(70,110,160,.12);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#172338; --surface:#1f3150; --surface2:#2a4068; --ink:#eaf2fb; --muted:#a8bbd5; --line:#34507a;
    --accent:#c4b5f5; --accent-ink:#2a2040; --accent-soft:#34406e; --accent2:#f0a3bf;
  --c1:#f4a6bd; --c2:#f1d27c; --c3:#a8d8a0; --c4:#9fcdf0; --c5:#f7b999; --c6:#c0b0ec;
    --warn:#f1c27a; --warn-soft:#3d3220; --good:#8fd8b0; --bad:#f4a0b3; --bad-soft:#44263a;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#172338; --surface:#1f3150; --surface2:#2a4068; --ink:#eaf2fb; --muted:#a8bbd5; --line:#34507a;
  --accent:#c4b5f5; --accent-ink:#2a2040; --accent-soft:#34406e; --accent2:#f0a3bf;
  --c1:#f4a6bd; --c2:#f1d27c; --c3:#a8d8a0; --c4:#9fcdf0; --c5:#f7b999; --c6:#c0b0ec;
  --warn:#f1c27a; --warn-soft:#3d3220; --good:#8fd8b0; --bad:#f4a0b3; --bad-soft:#44263a;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
body.lock{overflow:hidden}
#app{max-width:640px;margin:0 auto;min-height:60vh}
h1,h2,h3,p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono,.code{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}

/* buttons & inputs */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 16px;min-height:44px;font-weight:500}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.danger.armed{background:var(--bad);color:var(--surface)}
.btn.small{min-height:34px;padding:5px 12px;font-size:13px}
.link{background:none;border:0;color:var(--accent);padding:4px 0;font-size:13px;text-align:left}
.icon,.x{background:none;border:0;color:var(--muted);width:36px;height:36px;border-radius:8px;flex:none}
.x.armed{color:var(--surface);background:var(--bad);width:auto;padding:0 10px;font-size:12px}
label.f{display:block}
label.f>span,.lbl{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
input[type=text],input[type=number],input[type=date],input[type=time],select,textarea{
  width:100%;min-height:44px;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font-size:16px}
textarea{min-height:70px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stack{display:grid;gap:14px}
.actions{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:6px}
.actions .grow{margin-right:auto}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:8px;padding:10px 0}
.back{display:grid;place-items:center;width:36px;height:36px;border-radius:8px;font-size:26px;line-height:1;text-decoration:none;color:var(--ink);flex:none}
.ttl{min-width:0;flex:1}
.ttl b{display:block;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ttl small{color:var(--muted);font-size:12px}
.tag{display:flex;flex-direction:column;align-items:center;border:1.5px dashed var(--accent);border-radius:8px;background:var(--accent-soft);padding:3px 10px;color:var(--accent);flex:none}
.tag span{font-size:10px;letter-spacing:.08em}
.tag b{font-family:var(--f-mono);font-size:15px;letter-spacing:.08em}

.page{padding-bottom:calc(var(--tab-h) + 96px + env(safe-area-inset-bottom,0px));display:grid;gap:14px}
.hero{padding:28px 0 6px}
.hero h1{font-size:28px;letter-spacing:.02em}
.hero p{color:var(--muted);margin-top:6px;max-width:34em}
.cta{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0 6px}
.sec{font-size:13px;color:var(--muted);font-weight:500;letter-spacing:.06em;margin:22px 0 8px}
.empty{padding:28px 16px;text-align:center;color:var(--muted);border:1.5px dashed var(--line);border-radius:var(--r)}
.note{padding:10px 12px;border-radius:10px;font-size:13px;margin:6px 0}
.note.warn{background:var(--warn-soft);color:var(--warn)}
.note.bad{background:var(--bad-soft);color:var(--bad)}

/* boarding pass */
.passes{display:grid;gap:12px}
.pass{display:flex;background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);position:relative;overflow:hidden}
.pass-main{flex:1;min-width:0;padding:16px;text-decoration:none;color:var(--ink);display:grid;gap:2px;align-content:center}
.pass-name{font-size:18px;font-weight:700;overflow-wrap:anywhere}
.pass-sub{color:var(--muted);font-size:13px}
.pass-stub{width:132px;flex:none;padding:12px;border-left:2px dashed var(--line);display:grid;gap:2px;align-content:center;justify-items:start;position:relative}
.pass-stub::before,.pass-stub::after{content:"";position:absolute;left:-9px;width:16px;height:16px;border-radius:50%;background:var(--bg)}
.pass-stub::before{top:-9px}.pass-stub::after{bottom:-9px}
.lab{font-size:11px;color:var(--muted);letter-spacing:.08em}
.pass-stub .code{font-size:20px;font-weight:500;letter-spacing:.1em;color:var(--accent)}

/* cards */
.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:14px 16px}
.card h3{font-size:14px;color:var(--muted);font-weight:500;margin-bottom:10px;letter-spacing:.04em}
.row{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.row .grow{flex:1;min-width:0}
.sub{font-size:12px;color:var(--muted)}

/* days */
.days{display:flex;gap:8px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:thin}
.day{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 12px;text-align:left;min-width:84px;position:relative}
.day b{display:block;font-size:14px}.day small{font-size:11px;color:var(--muted)}
.day.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}.day.on small{color:inherit;opacity:.85}
.day.today::after{content:"今天";position:absolute;top:-7px;right:6px;background:var(--warn);color:var(--surface);font-size:10px;border-radius:6px;padding:0 5px}
.day.add{border-style:dashed;color:var(--accent);display:grid;place-items:center}
.item{display:flex;gap:12px;width:100%;text-align:left;background:var(--surface);border:0;border-radius:var(--r);box-shadow:var(--shadow);padding:12px 14px;margin-bottom:10px}
.item .t{font-family:var(--f-mono);font-size:13px;color:var(--accent);width:46px;flex:none;padding-top:2px}
.item b{display:block;overflow-wrap:anywhere}
.item .n{color:var(--muted);font-size:13px;white-space:pre-wrap;overflow-wrap:anywhere}

/* packing */
.prog{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden;margin:8px 0 4px}
.prog i{display:block;height:100%;background:var(--accent);border-radius:99px}
.chk{display:flex;align-items:center;gap:12px;flex:1;min-width:0;padding:6px 0;cursor:pointer}
.chk input{position:absolute;opacity:0;width:1px;height:1px}
.box{width:24px;height:24px;border-radius:7px;border:2px solid var(--line);flex:none;display:grid;place-items:center;background:var(--surface)}
.chk input:checked+.box{background:var(--accent);border-color:var(--accent)}
.chk input:checked+.box::after{content:"";width:6px;height:11px;border:solid var(--accent-ink);border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.chk input:focus-visible+.box{outline:2px solid var(--accent);outline-offset:2px}
.txt{overflow-wrap:anywhere}.txt.done{color:var(--muted);text-decoration:line-through}
.addrow{display:flex;gap:8px}.addrow input{flex:1}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{flex:1;border:0;background:none;padding:9px 8px;min-height:40px;font-size:14px}
.seg button.on{background:var(--accent);color:var(--accent-ink);font-weight:500}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 14px;font-size:14px;min-height:36px}
.chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:500}
.chip.ghost{border-style:dashed;color:var(--muted)}

/* money */
.big{font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{font-size:12px;color:var(--muted);font-weight:500;text-align:right;padding:4px 0}
.tbl td{padding:7px 0;border-top:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tblwrap{overflow-x:auto}
.pos{color:var(--good)}.neg{color:var(--bad)}
.xfer{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.xfer:first-of-type{border-top:0}
.xfer .who{flex:1;min-width:140px}
.xfer .amt{font-weight:700;font-variant-numeric:tabular-nums}
.bar{display:grid;grid-template-columns:56px 1fr auto;gap:10px;align-items:center;font-size:13px;margin:6px 0}
.bar i{display:block;height:10px;border-radius:99px;background:var(--accent);min-width:3px}
.exp{display:flex;gap:10px;width:100%;text-align:left;background:var(--surface);border:0;border-radius:var(--r);box-shadow:var(--shadow);padding:12px 14px;margin-bottom:10px;align-items:center}
.exp .grow{flex:1;min-width:0}.exp b{display:block;overflow-wrap:anywhere}
.exp .r{text-align:right;font-variant-numeric:tabular-nums;flex:none}
.exp .r small{display:block;color:var(--muted);font-size:12px}
.tagx{display:inline-block;font-size:11px;border-radius:6px;padding:0 6px;background:var(--surface2);color:var(--muted);margin-left:6px}
.rate{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.rate:first-of-type{border-top:0}
.rate input{width:110px;min-height:38px}
.crow{display:flex;align-items:center;gap:10px;margin-bottom:8px}.crow span{flex:1;min-width:0;overflow-wrap:anywhere}.crow input{width:130px}
.hint{font-size:13px;color:var(--muted);margin-top:4px}.hint.bad{color:var(--bad)}.hint.good{color:var(--good)}

/* tab bar, fab, sheet, toast */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar>div{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabbar button{border:0;background:none;height:var(--tab-h);display:grid;place-items:center;align-content:center;gap:2px;font-size:12px;color:var(--muted)}
.tabbar button.on{color:var(--accent);font-weight:700}
.tabbar svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.fab{position:fixed;z-index:15;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(var(--tab-h) + env(safe-area-inset-bottom,0px) + 14px);
  background:var(--accent);color:var(--accent-ink);border:0;border-radius:99px;padding:0 20px;height:48px;font-weight:700;box-shadow:0 6px 18px rgba(0,0,0,.25)}
#layer{position:fixed;inset:0;z-index:30}
.scrim{position:absolute;inset:0;background:rgba(8,20,26,.55)}
#sheet{position:absolute;left:0;right:0;bottom:0;max-width:640px;margin:0 auto;max-height:92%;overflow:auto;background:var(--surface);
  border-radius:18px 18px 0 0;padding:14px max(16px,env(safe-area-inset-left,0px)) calc(24px + env(safe-area-inset-bottom,0px));box-shadow:0 -8px 30px rgba(0,0,0,.25)}
.sh-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.sh-head h2{font-size:18px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tab-h) + env(safe-area-inset-bottom,0px) + 74px);background:var(--ink);color:var(--bg);
  padding:10px 16px;border-radius:10px;z-index:40;font-size:14px;max-width:min(92vw,520px);text-align:center}
.ticket{display:grid;justify-items:center;gap:4px;padding:18px;border:2px dashed var(--accent);border-radius:var(--r);background:var(--accent-soft);color:var(--accent)}
.ticket .code{font-size:34px;font-weight:500;letter-spacing:.18em}
.hero h1{color:var(--accent);background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.fab{background:var(--accent);color:var(--accent-ink);box-shadow:0 6px 16px rgba(122,100,192,.35)}
.day.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.card h3{color:var(--accent)}
.tagx{background:var(--accent-soft);color:var(--accent)}
.prog i{background:linear-gradient(90deg,var(--c3),var(--c4))}
.pass{border-top:5px solid var(--c1)}
.pass:nth-child(6n+2){border-top-color:var(--c4)}.pass:nth-child(6n+3){border-top-color:var(--c3)}
.pass:nth-child(6n+4){border-top-color:var(--c2)}.pass:nth-child(6n+5){border-top-color:var(--c5)}.pass:nth-child(6n+6){border-top-color:var(--c6)}
.pass-stub{background:linear-gradient(160deg,var(--accent-soft),var(--surface))}
.bar i{background:var(--c1)}
.bar:nth-of-type(6n+2) i{background:var(--c4)}.bar:nth-of-type(6n+3) i{background:var(--c3)}
.bar:nth-of-type(6n+4) i{background:var(--c2)}.bar:nth-of-type(6n+5) i{background:var(--c5)}.bar:nth-of-type(6n+6) i{background:var(--c6)}
.item{border-left:5px solid var(--c4)}
.item:nth-child(4n+1){border-left-color:var(--c1)}.item:nth-child(4n+2){border-left-color:var(--c2)}.item:nth-child(4n+3){border-left-color:var(--c3)}
.ov{display:grid;gap:12px}
.ovc{display:grid;gap:10px;width:100%;text-align:left;border:0;border-top:5px solid var(--c1);background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:14px 16px;color:var(--ink)}
.ovc:nth-child(6n+2){border-top-color:var(--c4)}.ovc:nth-child(6n+3){border-top-color:var(--c3)}
.ovc:nth-child(6n+4){border-top-color:var(--c2)}.ovc:nth-child(6n+5){border-top-color:var(--c5)}.ovc:nth-child(6n+6){border-top-color:var(--c6)}
.ovh{display:flex;justify-content:space-between;align-items:baseline;gap:4px 10px;flex-wrap:wrap}
.ovh b{font-size:16px;overflow-wrap:anywhere}
.ovbar{height:10px;border-radius:99px;background:var(--surface2);overflow:hidden}
.ovbar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kv>div{min-width:0}.kv small{display:block;font-size:11px;color:var(--muted)}
.kv b{display:block;font-size:15px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.est{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:12px;padding:10px 12px;border-radius:10px;background:var(--accent-soft)}
.ovctl{display:grid;gap:10px;margin:8px 0 4px}
.est input{width:76px;min-height:38px;text-align:center}
/* layout hardening: keep grid/flex children from stretching past their box */
.ovctl,.stack,.passes,.ovc{grid-template-columns:minmax(0,1fr)}
.two{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (max-width:420px){.two{grid-template-columns:minmax(0,1fr)}.two.keep{grid-template-columns:repeat(2,minmax(0,1fr))}}
.two>*,.f,.card,.ovc,.cmp{min-width:0}
select,input[type=text],input[type=number],input[type=date],input[type=time]{max-width:100%}
select{text-overflow:ellipsis}
.cmph{flex-wrap:wrap;row-gap:2px}
.cmph b{flex:1 1 150px;min-width:0}
.cmph .num{white-space:nowrap}
.tagx{white-space:nowrap}
.seg button{padding:9px 6px;line-height:1.25;font-size:13px}
.kv b{font-size:14px}
.chip{max-width:100%}
.est b{font-size:18px;font-variant-numeric:tabular-nums;color:var(--accent)}
.pass::before,.pass::after{content:"";position:absolute;top:calc(50% - 9px);width:18px;height:18px;border-radius:50%;background:var(--bg)}
.pass::before{left:-9px}.pass::after{right:-9px}
.pass-main .lab{letter-spacing:.14em;font-size:10px;color:var(--accent)}
.pass-stub .bc{display:block;width:100%;height:16px;margin:4px 0 2px;border-radius:2px;opacity:.5;background:repeating-linear-gradient(90deg,var(--ink) 0 2px,transparent 2px 4px,var(--ink) 4px 5px,transparent 5px 8px)}
.item{align-items:center}
.itemmain{display:flex;gap:12px;flex:1;min-width:0;background:none;border:0;padding:0;text-align:left;color:inherit}
.itemmain .tx{min-width:0;display:block}
.mv{display:flex;flex-direction:column;gap:2px;flex:none}
.x:disabled{opacity:.25;cursor:default}
.cmp{display:grid;gap:4px;padding:8px 0;border-top:1px solid var(--line)}
.cmp:first-of-type{border-top:0}
.cmph{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.cmph b{overflow-wrap:anywhere}
.no{flex:none;width:26px;height:26px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:13px;display:grid;place-items:center;font-variant-numeric:tabular-nums}
@media (max-width:420px){.pass-stub{width:112px}.two{grid-template-columns:1fr}.two.keep{grid-template-columns:1fr 1fr}}
@media (prefers-reduced-motion:no-preference){.fab,.btn,.chip{transition:transform .08s}.fab:active,.btn:active{transform:scale(.97)}}

/* mobile compact + iOS date input overflow fix */
input[type=date],input[type=time]{min-width:0;display:block;-webkit-appearance:none;appearance:none;text-align:left}
input[type=date]::-webkit-date-and-time-value{text-align:left;margin:0;min-height:1.3em}
@media (max-width:480px){
  body{font-size:14px}
  input[type=text],input[type=number],input[type=date],input[type=time],select,textarea{min-height:38px;padding:5px 10px;border-radius:9px}

(function(){
'use strict';
const isObj=v=>v&&typeof v==='object'&&!Array.isArray(v);
function merge(a,b){const o=Object.assign({},a);for(const k in b){o[k]=isObj(b[k])&&isObj(o[k])?merge(o[k],b[k]):b[k];}return o;}
const clone=v=>JSON.parse(JSON.stringify(v));
const parent=p=>p.slice(0,p.lastIndexOf('/'));
const seg=p=>p.split('/').length;

/* ---------- 本機模式 ---------- */
function localBackend(){
  const KEY='tb-localdb',UK='tb-localuid';
  const load=()=>{try{return JSON.parse(localStorage.getItem(KEY)||'{}')||{};}catch(e){return {};}};
  let data=load();const subs=new Set();
  const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(data));}catch(e){const er=new Error('quota');er.code='quota_exceeded';throw er;}};
  const snapOf=cp=>{const docs=Object.keys(data).filter(k=>parent(k)===cp&&seg(k)===seg(cp)+1).map(k=>({id:k.slice(cp.length+1),data:()=>clone(data[k])}));return {docs};};
  const fire=()=>subs.forEach(s=>{try{s.cb(snapOf(s.path));}catch(e){}});
  window.addEventListener('storage',e=>{if(e.key===KEY){data=load();fire();}});
  const doc=path=>({
    async set(v){data[path]=clone(v);save();fire();},
    async update(v){data[path]=merge(data[path]||{},clone(v));save();fire();},
    async delete(){delete data[path];save();fire();},
    async get(){return {exists:path in data,id:path.split('/').pop(),data:()=>clone(data[path]||{})};}
  });
  const collection=path=>({
    onSnapshot(cb){const s={path,cb};subs.add(s);setTimeout(()=>cb(snapOf(path)),0);return()=>subs.delete(s);},
    async get(){return snapOf(path);}
  });
  let uid=localStorage.getItem(UK);if(!uid){uid='local'+Math.random().toString(36).slice(2,10);localStorage.setItem(UK,uid);}
  return {db:{doc,collection},uid:async()=>uid};
}

/* ---------- Firebase 模式 ---------- */
function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=()=>rej(new Error('load '+src));document.head.appendChild(s);});}
async function firebaseBackend(cfg){
  const V='10.12.2',B='https://www.gstatic.com/firebasejs/'+V+'/';
  await loadScript(B+'firebase-app-compat.js');
  await Promise.all([loadScript(B+'firebase-auth-compat.js'),loadScript(B+'firebase-firestore-compat.js')]);
  firebase.initializeApp(cfg);
  const auth=firebase.auth(),fs=firebase.firestore();
  try{fs.enablePersistence({synchronizeTabs:true}).catch(()=>{});}catch(e){}
  /* Google 登入：已登入就直接用；否則顯示登入畫面 */
  const user0=await new Promise(res=>{const u=auth.onAuthStateChanged(x=>{u();res(x);});});
  if(!user0){
    await new Promise(res=>{
      const ov=document.createElement('div');
      ov.style.cssText='position:fixed;inset:0;z-index:100;background:var(--bg,#d7e8f8);display:grid;place-items:center;padding:24px';
      ov.innerHTML='<div style="max-width:360px;text-align:center;display:grid;gap:14px"><h1 style="margin:0;font-size:28px;color:var(--accent,#6a54b0)">旅伴手帳</h1><p style="margin:0;color:var(--muted,#52607f)">用 Google 帳號登入，換手機或換瀏覽器也能找回你的旅行資料。</p><button id="tb-g" class="btn primary" style="width:100%">用 Google 登入</button><div id="tb-ge" class="hint bad"></div></div>';
      document.body.appendChild(ov);
      const err=m=>{ov.querySelector('#tb-ge').textContent=m;};
      const done=()=>{ov.remove();res();};
      auth.onAuthStateChanged(x=>{if(x)done();});
      auth.getRedirectResult().catch(e=>err('登入失敗（'+(e.code||'錯誤')+'）'));
      ov.querySelector('#tb-g').addEventListener('click',()=>{
        err('');
        const p=new firebase.auth.GoogleAuthProvider();
        auth.signInWithPopup(p).catch(e=>{
          if(e.code==='auth/popup-blocked'||e.code==='auth/operation-not-supported-in-this-environment'){auth.signInWithRedirect(p);return;}
          if(e.code==='auth/popup-closed-by-user'||e.code==='auth/cancelled-popup-request')return;
          err(e.code==='auth/unauthorized-domain'?'這個網址還沒加入 Firebase 的授權網域':e.code==='auth/operation-not-allowed'?'Firebase 尚未啟用 Google 登入':'登入失敗（'+(e.code||'錯誤')+'）');
        });
      });
    });
  }
  const fix=e=>{if(e&&e.code==='permission-denied')e.code='invalid_argument';throw e;};
  const doc=path=>{const r=fs.doc(path);return {
    set:v=>r.set(v).catch(fix),
    update:v=>r.set(v,{merge:true}).catch(fix),   // 巢狀物件深度合併、陣列整個取代，與原本行為一致
    delete:()=>r.delete().catch(fix)};};
  const collection=path=>{const c=fs.collection(path);return {
    onSnapshot:(cb,err)=>c.onSnapshot(s=>cb({docs:s.docs.map(d=>({id:d.id,data:()=>d.data()}))}),err),
    get:()=>c.get().then(s=>({docs:s.docs.map(d=>({id:d.id,data:()=>d.data()}))}))};};
  return {db:{doc,collection},uid:async()=>auth.currentUser.uid};
}

<script>
(function(){
'use strict';
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rid=(n=8)=>{const a='abcdefghijklmnopqrstuvwxyz0123456789';const u=new Uint8Array(n);crypto.getRandomValues(u);let s='';for(const b of u)s+=a[b%36];return s;};
const CODE_AL='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
const genCode=()=>{const u=new Uint8Array(6);crypto.getRandomValues(u);let s='';for(const b of u)s+=CODE_AL[b%CODE_AL.length];return s;};

const CUR={TWD:['新台幣','NT$',0],JPY:['日圓','¥',0],KRW:['韓元','₩',0],USD:['美元','US$',2],EUR:['歐元','€',2],THB:['泰銖','฿',2],CNY:['人民幣','CN¥',2],HKD:['港幣','HK$',2],SGD:['新加坡幣','S$',2],MYR:['馬來西亞令吉','RM',2],VND:['越南盾','₫',0],GBP:['英鎊','£',2],AUD:['澳幣','A$',2]};
const cname=c=>CUR[c]?CUR[c][0]:c;
const cdec=c=>CUR[c]?CUR[c][2]:2;
function money(n,cur){
  const d=cdec(cur);
  const s=new Intl.NumberFormat('zh-TW',{minimumFractionDigits:d,maximumFractionDigits:d}).format(Math.abs(n));
  return (n<0?'-':'')+(CUR[cur]?CUR[cur][1]:cur+' ')+s;
}
const SUGGEST=['護照／證件','手機與充電線','行動電源','轉接插頭','換洗衣物','盥洗用品','常用藥品','雨具','現金與信用卡','網卡／eSIM','口罩','防曬用品','拖鞋','耳機'];
const CATS=['餐飲','交通','機票','住宿','門票','購物','其他'];

const DESTS=['日本','韓國','泰國','越南','新加坡','馬來西亞','香港','中國','美國','英國','歐洲','澳洲','台灣'];

//#LEDGER-START
/* Pure ledger: everything is computed in integer cents of the trip's base currency. */
function computeLedger(trip,people,spend){
  const base=trip.base, rates=trip.rates||{};
  const net={},paid={},owed={};
  people.forEach(p=>{net[p.id]=0;paid[p.id]=0;owed[p.id]=0;});
  let total=0,missing=0;
  const byCur={},byCat={},missingCur={};
  for(const e of spend){
    const r=e.cur===base?1:Number(rates[e.cur]);
    if(!(r>0)){missing++;missingCur[e.cur]=1;continue;}
    const cents=x=>Math.round(x*r*100);
    const shares={};let tot=0,orig=0;
    if(e.mode==='custom'){
      for(const pid in (e.custom||{})){const a=Number(e.custom[pid])||0;const c=cents(a);if(c>0){shares[pid]=c;tot+=c;orig+=a;}}
    }else if(e.mode==='treat'){
      tot=cents(e.amount);orig=Number(e.amount);shares[e.payer]=tot;
    }else{
      const among=(e.among||[]).filter(id=>id in net).sort();
      if(!among.length)continue;
      tot=cents(e.amount);orig=Number(e.amount);
      const b=Math.floor(tot/among.length);let rem=tot-b*among.length;
      among.forEach(id=>{shares[id]=b+(rem>0?1:0);if(rem>0)rem--;});
    }
    if(!(e.payer in net))continue;
    const isT=e.mode==='transfer';
    net[e.payer]+=tot;
    if(!isT)paid[e.payer]+=tot;
    for(const pid in shares){if(!(pid in net))continue;net[pid]-=shares[pid];if(!isT)owed[pid]+=shares[pid];}
    if(!isT&&e.settled){for(const pid in shares){if(pid!==e.payer&&e.settled[pid]&&(pid in net)){net[e.payer]-=shares[pid];net[pid]+=shares[pid];}}}
    if(!isT){
      total+=tot;
      byCur[e.cur]=(byCur[e.cur]||0)+orig;
      const k=e.cat||'其他';byCat[k]=(byCat[k]||0)+tot;
    }
  }
  const cr=[],db=[];
  for(const id in net){if(net[id]>0)cr.push([id,net[id]]);else if(net[id]<0)db.push([id,-net[id]]);}
  const transfers=[];
  while(cr.length&&db.length){
    cr.sort((a,b)=>b[1]-a[1]);db.sort((a,b)=>b[1]-a[1]);
    const a=Math.min(cr[0][1],db[0][1]);
    transfers.push({from:db[0][0],to:cr[0][0],cents:a});
    cr[0][1]-=a;db[0][1]-=a;
    if(cr[0][1]===0)cr.shift();
    if(db[0][1]===0)db.shift();
  }
  const dec=CUR[base]?CUR[base][2]:2;
  const shown=transfers.filter(t=>dec===0?Math.round(t.cents/100)>0:t.cents>=1);
  return {net,paid,owed,total,missing,missingCur,byCur,byCat,transfers:shown};
}
//#LEDGER-END

function flightItems(rows){

function fxTWD(c,skipManual){
  if(c==='TWD')return 1;

  for(const id in S.trips){const t=S.trips[id],r=t.rates||{};
    if(t.base==='TWD'&&Number(r[c])>0)return Number(r[c]);
    if(t.base===c&&Number(r.TWD)>0)return 1/Number(r.TWD);}
  return null;
}

/* plan */
function planCmp(a,b){return (a.ord!=null?a.ord:(a.at||0))-(b.ord!=null?b.ord:(b.at||0))||(a.at||0)-(b.at||0);}
function dayItems(day){return S.td.plan.filter(p=>(p.day||1)===day).sort(planCmp);}
function renumber(list){
  const tid=S.tid;const jobs=[];
  list.forEach((p,i)=>{if(p.ord!==i*10)jobs.push(()=>dbp('trips/'+tid+'/plan/'+p.id).update({ord:i*10}));});
  if(!jobs.length)return;
  return w(()=>q('plan:'+tid,async()=>{for(const j of jobs)await j();}));
}
function movePlan(id,dir){
  const it=S.td.plan.find(x=>x.id===id);if(!it)return;
  const list=dayItems(it.day||1);const i=list.findIndex(x=>x.id===id);const j=i+dir;
  if(j<0||j>=list.length)return;
  [list[i],list[j]]=[list[j],list[i]];renumber(list);
}
function sortDayByTime(){
  const list=dayItems(S.day).slice().sort((a,b)=>(a.time||'99:99').localeCompare(b.time||'99:99'));
  renumber(list);toast('已依時間重排');
}
function viewPlan(t){
  const n=Math.max(t.days||1,...S.td.plan.map(p=>p.day||1));
  if(S.day>n)S.day=1;
  let pills='';
  for(let i=1;i<=n;i++)pills+='<button class="day'+(i===S.day?' on':'')+(isToday(t,i)?' today':'')+'" data-act="day" data-day="'+i+'"><b>Day '+i+'</b><small>'+esc(dayLabel(t,i)||'　')+'</small></button>';
  pills+='<button class="day add" data-act="add-day">＋ 加一天</button>';
  if(n>1){const k=S.td.plan.filter(p=>(p.day||1)===n).length;pills+='<button class="day add" data-act="rm-day">'+(armed('rm-day')?'確認刪除 Day '+n+(k?'（含 '+k+' 個行程）':'')+'？':'－ 減一天')+'</button>';}
  const items=dayItems(S.day);
  return '<div class="days" role="tablist">'+pills+'</div>'+
   (items.length?'<div>'+(items.length>1?'<div style="text-align:right"><button class="link" data-act="sort-time">依時間重排</button></div>':'')+items.map((p,i)=>'<div class="item"><button class="itemmain" data-act="edit-plan" data-id="'+p.id+'"><span class="no">'+(i+1)+'</span><span class="t">'+esc(p.time||'—')+'</span><span class="tx"><b>'+esc(p.title)+'</b>'+(p.note?'<span class="n">'+esc(p.note)+'</span>':'')+'</span></button><div class="mv"><button class="x" data-act="mv-plan" data-dir="-1" data-id="'+p.id+'" aria-label="上移"'+(i===0?' disabled':'')+'>▲</button><button class="x" data-act="mv-plan" data-dir="1" data-id="'+p.id+'" aria-label="下移"'+(i===items.length-1?' disabled':'')+'>▼</button></div></div>').join('')+'</div>'
    :'<div class="empty">Day '+S.day+' 還沒有安排。按右下角「＋ 行程」新增，旅伴都會看到。</div>');
}

/* packing */

  return {shared,extra,checked,total,done};
}

function addPack(text,scope){

/* spend */
function splitLabel(e){
  if(e.mode==='treat')return '請客';
  if(e.mode==='custom')return '各自指定';
  if(e.mode==='transfer')return '還給 '+pname((e.among||[])[0]);
  const n=(e.among||[]).length;
  if(n===1)return pname(e.among[0])+' 全額';
  return n===S.td.people.length?'全員平分':'平分 '+n+' 人';
}
const PCATS=['機票','交通','住宿','餐飲','門票','購物','網卡／保險','其他'];
function mineSum(list,t){const rates=t.rates||{};let sum=0,missing=0;const byCat={};
  for(const e of list){const r=e.cur===t.base?1:Number(rates[e.cur]);
    if(!(r>0)){missing++;continue;}
    const v=Math.round(e.amount*r*100)/100;sum+=v;const k=e.cat||'其他';byCat[k]=(byCat[k]||0)+v;}

async function saveExpense(form){
  const t=trip(),st=form._st,id=form.dataset.id;
  const fd=new FormData(form);
  const title=String(fd.get('title')).trim();
  const amount=parseFloat(fd.get('amount'));
  const cur=String(fd.get('cur'));
  if(!title||!(amount>0)){toast('請填寫名稱與金額');return;}
  const data={title,amount,cur,payer:String(fd.get('payer')),mode:st.mode,cat:String(fd.get('cat')),among:[],custom:{},at:Date.now()};
  const old=id?S.td.spend.find(x=>x.id===id):null;if(old&&old.at)data.at=old.at;
  data.pay=String(fd.get('pay')||'');if(data.pay)ls('tb-pay',data.pay);
  data.ft=data.cat==='機票'?String(fd.get('ft')||''):'';
  data.note=String(fd.get('note')||'').trim();
  if(st.mode==='equal'){
    data.among=[...st.among];
    if(!data.among.length){toast('請至少選一位分攤的人');return;}
  }else if(st.mode==='custom'){
    let sum=0;form.querySelectorAll('[data-c]').forEach(i=>{const v=parseFloat(i.value)||0;if(v>0){data.custom[i.dataset.c]=v;sum+=v;}});
    if(Math.abs(sum-amount)>0.005){toast('各人金額加起來要等於總額（目前相差 '+money(Math.round((amount-sum)*100)/100,cur)+'）');return;}
  }
  data.settled={};
  if(st.mode!=='treat'){const cand=st.mode==='equal'?data.among:Object.keys(data.custom);cand.forEach(pid=>{if(pid!==data.payer&&st.settled.has(pid))data.settled[pid]=true;});}
  const tu=rateUpd(t,cur,parseFloat(fd.get('rate')));
  closeSheet();
  if(tu)await w(()=>q('t:'+S.tid,()=>dbp('trips/'+S.tid).update(tu)));
  await w(()=>dbp('trips/'+S.tid+'/spend/'+(id||rid(8))).set(data));
}

/* ---------- wallet ---------- */
const PAYS=['現金','刷卡','行動支付','其他'];
function payOpts(cur){
  const def=cur!=null?cur:(ls('tb-pay')||'現金');
  return (cur===''?'<option value="" selected>未指定</option>':'')+PAYS.map(p=>'<option'+(p===def?' selected':'')+'>'+p+'</option>').join('');
}
function payTotals(t,mineL,spL,me){
  let cashOut=0,knownOut=0;const rt=t.rates||{};
  const f=e=>{if(!e.pay||e.mode==='transfer')return;const r=e.cur===t.base?1:Number(rt[e.cur]);if(!(r>0))return;const v=(Number(e.amount)||0)*r;knownOut+=v;if(e.pay==='現金')cashOut+=v;};
  mineL.forEach(f);spL.forEach(e=>{if(e.payer===me)f(e);});
  return {cashOut,knownOut};
}
/* per-currency wallet: exchanges in, cash out (my entries + shared ones I paid) */
function walletStats(t,excl){
  const me=meId(),out={};
  const g=c=>out[c]||(out[c]={init:0,inAmt:0,twd:0,out:0,cash:0,card:0,mobile:0,other:0});
  (P().wallet||[]).forEach(x=>{if(!x.cur||x.id===excl)return;
    if(x.kind==='init'){g(x.cur).init+=Number(x.amt)||0;return;}
    const o=g(x.cur);o.inAmt+=Number(x.amt)||0;o.twd+=Number(x.twd)||0;g('TWD').out+=Number(x.twd)||0;});
  const add=e=>{if(!e.pay||e.id===excl)return;const o=g(e.cur);const a=Number(e.amount)||0;
    if(e.pay==='現金')o.cash+=a;else if(e.pay==='刷卡')o.card+=a;else if(e.pay==='行動支付')o.mobile+=a;else o.other+=a;};
  (P().mine||[]).forEach(add);
  S.td.spend.forEach(e=>{if(e.mode!=='transfer'&&e.payer===me)add(e);});
  return out;
}
const wBal=o=>o.init+o.inAmt-o.out-o.cash;
const wHas=o=>!!o&&(o.init>0||o.inAmt>0);
function cashHint(t,cur,a,pay,excl,mineOk){
  if(pay!=='現金'||!mineOk)return {text:'',bad:false};
  const o=walletStats(t,excl)[cur];if(!wHas(o))return {text:'',bad:false};
  const left=wBal(o)-(a||0);
  return {text:'付完後身上剩餘 '+cur+' 現金：'+money(left,cur)+(left<0?'（超過錢包紀錄）':''),bad:left<0};
}
function leftDays(t){
  if(!t.start)return null;const d0=addDays(t.start,0),n=new Date(),n0=new Date(n.getFullYear(),n.getMonth(),n.getDate());
  const idx=Math.round((n0-d0)/86400000),days=t.days||1;
  if(idx<0)return days;if(idx<days)return days-idx;return null;
}
function histStats(t){
  ensureOv();
  const ids=Object.keys(S.mine).filter(id=>S.trips[id]);
  const same=ids.filter(id=>t.dest&&(S.trips[id].dest||'').trim()===t.dest.trim());
  const pick=same.length?same:ids;
  let sum=0,days=0,cash=0,known=0;
  pick.forEach(id=>{const st=ovConv(ovStats(id),'TWD');if(!st)return;sum+=st.mine;days+=st.days;cash+=st.cashOut||0;known+=st.knownOut||0;});
  return {perDay:days?sum/days:0,ratio:known>0?cash/known:null,same:same.length>0};
}
function planOut(days,per,pct,rt,rem,c){
  const total=days*per,cashT=total*pct/100,cardT=total-cashT;
  if(!(rt>0))return '<div class="sub">缺少 '+esc(c)+' 的匯率。先記一筆換匯，或到「設定」輸入匯率，就能換算。</div>';

  return '<div class="kv"><div><small>預估總花費</small><b>'+money(total,'TWD')+'</b></div><div><small>現金（'+esc(c)+'）</small><b>'+money(cashF,c)+'</b></div><div><small>刷卡／其他</small><b>'+money(cardT,'TWD')+'</b></div></div>'+
    '<div class="sub" style="margin-top:8px">現金約等於 '+money(cashT,'TWD')+'（以 1 '+esc(c)+' ≈ '+(+rt.toPrecision(4))+' TWD 換算）。目前身上有 '+money(rem,c)+'，'+
    (need>0?'還差 <b>'+money(need,c)+'</b>，約要再換 <b>'+money(need*rt,'TWD')+'</b>。':'已經夠了。')+'</div>';

/* ---------- writes ---------- */
async function readCol(path){const s=await S.db.collection(path).get();return s.docs.map(d=>Object.assign({id:d.id},d.data()));}
async function pool(jobs,n){let i=0;async function run(){while(i<jobs.length){const j=jobs[i++];await j();}}await Promise.all(Array.from({length:Math.min(n,jobs.length)},run));}
async function createTrip(v){
  const tid=rid(10),code=newCode(),pid=rid(8);
  await S.db.doc('trips/'+tid).set({name:v.name,dest:v.dest,start:v.start,days:v.days,base:v.base,currencies:v.currencies,rates:v.rates,code,at:Date.now()});
  await S.db.doc('trips/'+tid+'/people/'+pid).set({name:v.me,at:Date.now()});
  await S.db.doc('data/users/'+S.uid+'/'+tid).set({me:pid,joinedAt:Date.now(),checked:{},extra:[]});
  return tid;
}
async function copyTrip(srcId,o){
  const src=S.trips[srcId];
  const [ppl,plan,pack]=await Promise.all([readCol('trips/'+srcId+'/people'),o.withPlan?readCol('trips/'+srcId+'/plan'):[],o.withPack?readCol('trips/'+srcId+'/pack'):[]]);
  const myOld=(S.mine[srcId]||{}).me;
  const tid=rid(10),code=newCode();
  await S.db.doc('trips/'+tid).set({name:o.name,dest:src.dest||'',start:o.start||'',days:src.days||1,base:src.base,currencies:(src.currencies||[]).slice(),rates:o.withRates?Object.assign({},src.rates||{}):{},code,at:Date.now(),from:srcId});
  const pmap={};const jobs=[];
  const keep=o.withPeople?ppl:ppl.filter(p=>p.id===myOld);
  keep.forEach(p=>{const nid=rid(8);pmap[p.id]=nid;jobs.push(()=>S.db.doc('trips/'+tid+'/people/'+nid).set({name:p.name,at:p.at||Date.now()}));});
  let me=pmap[myOld];
  if(!me){me=rid(8);jobs.push(()=>S.db.doc('trips/'+tid+'/people/'+me).set({name:'我',at:Date.now()}));}
  plan.forEach(i=>jobs.push(()=>S.db.doc('trips/'+tid+'/plan/'+rid(8)).set({day:i.day||1,time:i.time||'',title:i.title,note:i.note||'',at:i.at||Date.now(),ord:i.ord!=null?i.ord:(i.at||0)})));
  pack.forEach(i=>jobs.push(()=>S.db.doc('trips/'+tid+'/pack/'+rid(8)).set({text:i.text,at:i.at||Date.now()})));
  await pool(jobs,4);
  const mineOld=S.mine[srcId]||{};
  const extra=o.withPack?(mineOld.extra||[]).map(x=>({id:rid(6),text:x.text,done:false})):[];
  await S.db.doc('data/users/'+S.uid+'/'+tid).set({me,joinedAt:Date.now(),checked:{},extra});
  return tid;
}

document.addEventListener('click',ev=>{
  const el=ev.target.closest('[data-act]');if(!el)return;
  const a=el.dataset.act,d=el.dataset;
  switch(a){
    case 'close-sheet':closeSheet();break;
    case 'ov-cat':case 't-cat':{
      const key=a==='ov-cat'?'ovCats':'tcats';const c=d.cat;
      if(c==='all')S[key]=[];else{const a=new Set(S[key]||[]);if(a.has(c))a.delete(c);else a.add(c);S[key]=[...a];}
      render(true);break;}
    case 'cmp-view':S.cmpView=d.v;render(true);break;
    case 'ov-cur':openOvCur();break;
    case 'home-tab':S.homeTab=d.v;if(d.v==='ov')ensureOv();render(true);break;
    case 'open-ov':S.nextTab='spend';S.spendView='mine';location.hash='#t-'+d.id;break;
    case 'new-trip':openNewTrip();break;
    case 'join-code':openJoin();break;
    case 'copy-trip':openCopy(d.id);break;
    case 'copy-trip-here':openCopy(S.tid);break;
    case 'copy-code':{
      const code=d.code;
      const fail=()=>toast('房間代碼：'+code+'（請手動複製）');
      try{navigator.clipboard.writeText(code).then(()=>toast('已複製房間代碼 '+code),fail);}catch(e){fail();}
      break;}
    case 'tab':S.tab=d.tab;S.armed=null;render(true);window.scrollTo(0,0);break;
    case 'day':S.day=+d.day;render(true);break;
    case 'rm-day':{
      const t=trip();const n=Math.max(t.days||1,...S.td.plan.map(p=>p.day||1));
      if(n<=1)break;
      arm('rm-day',()=>{const tid=S.tid;const gone=S.td.plan.filter(p=>(p.day||1)===n);if(S.day>=n)S.day=n-1;
        w(async()=>{for(const p of gone)await dbp('trips/'+tid+'/plan/'+p.id).delete();await q('t:'+tid,()=>dbp('trips/'+tid).update({days:n-1}));});});
      break;}
    case 'add-day':{const t=trip();const n=Math.max(t.days||1,...S.td.plan.map(p=>p.day||1))+1;S.day=n;w(()=>q('t:'+S.tid,()=>dbp('trips/'+S.tid).update({days:n})));break;}
    case 'mv-plan':movePlan(d.id,+d.dir);break;
    case 'sort-time':sortDayByTime();break;
    case 'add-plan':openPlan();break;
    case 'edit-plan':openPlan(d.id);break;
    case 'pack-scope':S.packScope=d.scope;render(true);break;
    case 'quick-pack':addPack(d.text,S.packScope);break;
    case 'del-pack':{
      const kind=d.kind,id=d.id;
      arm('pack:'+kind+':'+id,()=>{
        if(kind==='all')w(()=>dbp('trips/'+S.tid+'/pack/'+id).delete());
        else{const extra=(P().extra||[]).filter(x=>x.id!==id);const tid=S.tid;w(()=>q('p:'+tid,()=>dbp('data/users/'+S.uid+'/'+tid).update({extra})));}
      });break;}
    case 'spend-view':S.spendView=d.v;S.armed=null;render(true);break;
    case 'add-mine':openMine();break;
    case 'edit-mine':openMine(d.id);break;
    case 'add-spend':openExpense();break;
    case 'copy-pub':{
      const pe=S.td.pub.find(x=>x.id===d.id);if(!pe)break;
      const tid=S.tid,mine=(P().mine||[]).slice();
      if(mine.some(x=>x.from===pe.id)){toast('已經複製過了');break;}
      mine.push({id:rid(6),title:pe.title,amount:pe.amount,cur:pe.cur,cat:pe.cat||'其他',ft:pe.ft||'',date:pe.date||'',note:'',pub:false,at:Date.now(),from:pe.id});
      w(()=>q('p:'+tid,()=>dbp('data/users/'+S.uid+'/'+tid).update({mine})));
      toast('已複製到「我的花費」');break;}
    case 'edit-spend':openExpense(d.id);break;
    case 'settle':{
      const key='settle:'+d.from+':'+d.to;const t=trip();
      arm(key,()=>w(()=>dbp('trips/'+S.tid+'/spend/'+rid(8)).set({title:'還款',amount:+d.amt,cur:t.base,payer:d.from,mode:'transfer',among:[d.to],custom:{},cat:'',at:Date.now()})));
      break;}
    case 'rename-person':openRename(d.id);break;
    case 'set-me':{const tid=S.tid;w(()=>q('p:'+tid,()=>dbp('data/users/'+S.uid+'/'+tid).update({me:d.id})));break;}
    case 'del-person':{
      const id=d.id;
      const used=S.td.spend.some(e=>e.payer===id||(e.among||[]).includes(id)||(e.custom&&e.custom[id]!=null));
      if(used){toast('這位旅伴已有帳目，不能移除。');break;}
      if(S.td.people.length<=1){toast('至少要留一位旅伴。');break;}
      arm('person:'+id,()=>w(()=>dbp('trips/'+S.tid+'/people/'+id).delete()));break;}
    case 'del-cur':{
      const c=d.cur;
      if(S.td.spend.some(e=>e.cur===c)){toast(c+' 已有帳目，不能移除。');break;}
      const t=trip();const next=(t.currencies||[]).filter(x=>x!==c);
      w(()=>q('t:'+S.tid,()=>dbp('trips/'+S.tid).update({currencies:next})));break;}
    case 'add-exch':openExch();break;
    case 'add-init':openInit();break;
    case 'edit-exch':{const x=(P().wallet||[]).find(y=>y.id===d.id);if(x&&x.kind==='init')openInit(d.id);else openExch(d.id);break;}
    case 'wallet-rate':{const tu=rateUpd(trip(),d.cur,parseFloat(d.r));if(tu)w(()=>q('t:'+S.tid,()=>dbp('trips/'+S.tid).update(tu)));toast('已把平均換匯匯率設為這趟匯率（旅伴也會看到）');break;}
    case 'edit-trip':openTripForm();break;
    case 'leave':{
      const tid=S.tid;
      arm('leave',async()=>{await w(()=>dbp('data/users/'+S.uid+'/'+tid).delete());location.hash='';});break;}
  }
});

    if(v==='__other'){if(DESTS.includes(inp.value))inp.value='';inp.hidden=false;try{inp.focus();}catch(e){}}
    else{inp.value=v;inp.hidden=true;}
    return;
  }
  const c=ev.target.closest('[data-pack]');
  if(c){
    const kind=c.dataset.pack,id=c.dataset.id,on=c.checked,tid=S.tid;
    if(kind==='all')w(()=>q('p:'+tid,()=>dbp('data/users/'+S.uid+'/'+tid).update({checked:{[id]:on}})));
    else{const extra=(P().extra||[]).map(x=>x.id===id?Object.assign({},x,{done:on}):x);w(()=>q('p:'+tid,()=>dbp('data/users/'+S.uid+'/'+tid).update({extra})));}
    return;
  }
  const r=ev.target.closest('[data-rate]');
  if(r){
    const cur=r.dataset.rate,v=parseFloat(r.value);
    if(!(v>0)){toast('匯率要大於 0');return;}
    w(()=>q('t:'+S.tid,()=>dbp('trips/'+S.tid).update({rates:{[cur]:v}})));
  }
});
document.addEventListener('submit',async ev=>{
  const form=ev.target.closest('form[data-form]');if(!form)return;
  ev.preventDefault();
  const kind=form.dataset.form;const fd=new FormData(form);
  const g=n=>String(fd.get(n)==null?'':fd.get(n)).trim();
  if(kind==='newtrip'){
    const st=form._st;const base=g('base');
    const currencies=[...st.cur].filter(c=>c!==base);
    const rates={};currencies.forEach(c=>{const r=parseFloat(st.rates[c]);if(r>0)rates[c]=r;});
    const v={name:g('name'),dest:g('dest'),start:g('start'),days:Math.max(1,Math.min(60,parseInt(g('days'))||1)),me:g('me'),base,currencies,rates};
    if(!v.name||!v.me)return;
    ls('tb-name',v.me);closeSheet();
    const tid=await w(()=>createTrip(v));if(tid)go(tid);
  }else if(kind==='joincode'||kind==='gate'){
    const code=g('code').toUpperCase().replace(/[^A-Z0-9]/g,'');
    const id=Object.keys(S.trips).find(k=>S.trips[k].code===code);
    if(!id||(kind==='gate'&&id!==S.tid)){toast('找不到這組房間代碼，請再確認一次。');return;}
    if(S.mine[id]){closeSheet();go(id);return;}
    closeSheet();startJoin(id);
  }else if(kind==='identity'){
    const tid=form.dataset.tid;const name=g('name');let pid=form._pid;
    if(!pid&&!name){toast('請選擇你是誰，或輸入名字');return;}
    closeSheet();
    const ok=await w(async()=>{
      if(!pid){pid=rid(8);await S.db.doc('trips/'+tid+'/people/'+pid).set({name,at:Date.now()});ls('tb-name',name);}
      await S.db.doc('data/users/'+S.uid+'/'+tid).set({me:pid,joinedAt:Date.now(),checked:{},extra:[]});return true;});
    if(ok)go(tid);
  }else if(kind==='plan'){
    const id=form.dataset.id;const title=g('title');if(!title)return;
    const old=id?S.td.plan.find(x=>x.id===id):null;
    closeSheet();
    w(()=>dbp('trips/'+S.tid+'/plan/'+(id||rid(8))).set({day:parseInt(g('day'))||1,time:g('time'),title,note:g('note'),at:old&&old.at?old.at:Date.now(),...(old&&old.ord!=null?{ord:old.ord}:{})}));
    S.day=parseInt(g('day'))||1;
  }else if(kind==='init'){
    const tid=S.tid,id=form.dataset.id;const amt=parseFloat(g('amt'));
    if(!(amt>0)){toast('請填寫金額');return;}
    const list=(P().wallet||[]).slice();const old=id?list.find(x=>x.id===id):null;
    const entry={id:id||rid(6),kind:'init',cur:g('cur'),amt,date:g('date'),note:g('note'),at:old&&old.at?old.at:Date.now()};
    const wallet=id?list.map(x=>x.id===id?entry:x):list.concat([entry]);
    closeSheet();
    w(()=>q('p:'+tid,()=>dbp('data/users/'+S.uid+'/'+tid).update({wallet})));
  }else if(kind==='exch'){
    const tid=S.tid,id=form.dataset.id;const twd=parseFloat(g('twd')),amt=parseFloat(g('amt'));
    if(!(twd>0&&amt>0)){toast('請填寫台幣與外幣金額');return;}
    const list=(P().wallet||[]).slice();const old=id?list.find(x=>x.id===id):null;
    const entry={id:id||rid(6),cur:g('cur'),twd,amt,date:g('date'),note:g('note'),at:old&&old.at?old.at:Date.now()};
    const wallet=id?list.map(x=>x.id===id?entry:x):list.concat([entry]);
    S.walletCur=entry.cur;S.planCur=entry.cur;closeSheet();
    w(()=>q('p:'+tid,()=>dbp('data/users/'+S.uid+'/'+tid).update({wallet})));
  }else if(kind==='rename'){
    const id=form.dataset.id,name=g('name');if(!name)return;
    closeSheet();
    w(()=>q('n:'+id,()=>dbp('trips/'+S.tid+'/people/'+id).update({name})));
  }else if(kind==='mine'){
    saveMine(form);
  }else if(kind==='expense'){
    saveExpense(form);
  }else if(kind==='addpack'){
    const text=g('text');if(!text)return;
    await addPack(text,S.packScope);
    render(true);const i=$('#pk-input');if(i)i.focus();
  }else if(kind==='addperson'){
    const name=g('name');if(!name)return;
    await w(()=>dbp('trips/'+S.tid+'/people/'+rid(8)).set({name,at:Date.now()}));
    render(true);
  }else if(kind==='addcur'){
    const c=g('cur');const t=trip();if(!c)return;
    w(()=>q('t:'+S.tid,()=>dbp('trips/'+S.tid).update({currencies:(t.currencies||[]).concat([c])})));
  }else if(kind==='trip'){
    const minDays=Math.max(1,...S.td.plan.map(p=>p.day||1));
    const data={name:g('name'),dest:g('dest'),start:g('start'),days:Math.max(minDays,Math.min(60,parseInt(g('days'))||1))};
    if(!data.name)return;
    closeSheet();w(()=>q('t:'+S.tid,()=>dbp('trips/'+S.tid).update(data)));
  }else if(kind==='ovcur'){
    const cur=g('cur');const fx=Object.assign({},S.fx||{});
    form.querySelectorAll('[data-fx]').forEach(i=>{const v=parseFloat(i.value);if(v>0)fx[i.dataset.fx]=v;});
    S.fx=fx;S.ovCur=cur;ls('tb-fx',JSON.stringify(fx));ls('tb-ovcur',cur);
    closeSheet();render(true);
  }else if(kind==='copy'){
    const src=form.dataset.src;const o={name:g('name'),start:g('start'),withPlan:!!fd.get('withPlan'),withPack:!!fd.get('withPack'),withPeople:!!fd.get('withPeople'),withRates:!!fd.get('withRates')};
    if(!o.name)return;
    closeSheet();toast('複製中…');
    const tid=await w(()=>copyTrip(src,o));if(tid)go(tid);
  }
});
document.addEventListener('input',ev=>{
  const tg=ev.target;if(!tg.closest)return;
  if(tg.closest('[data-plan]')){
    const box=document.getElementById('plan');if(!box)return;
    const v=k=>parseFloat(box.querySelector('[data-plan="'+k+'"]').value)||0;
    const days=Math.max(0,Math.min(365,v('days'))),per=Math.max(0,v('per')),pct=Math.max(0,Math.min(100,v('pct')));
    S.planDays=days;S.planPer=per;S.cashPct=pct;
    document.getElementById('plan-out').innerHTML=planOut(days,per,pct,parseFloat(box.dataset.rt)||0,parseFloat(box.dataset.rem)||0,box.dataset.cur);
    return;}
  if(tg.closest('[data-est],[data-estpct]')){
    const e=document.querySelector('[data-est]'),p=document.querySelector('[data-estpct]');if(!e)return;
    const n=Math.max(0,Math.min(365,parseFloat(e.value)||0));S.estDays=n;
    const pc=p?Math.max(0,Math.min(100,parseFloat(p.value)||0)):null;if(pc!=null)S.cashPct=pc;
    const per=parseFloat(e.dataset.perday),cur=e.dataset.cur;
    const out=document.getElementById(e.dataset.for);if(out)out.textContent=money(n*per,cur);
    const oc=document.getElementById('estc');if(oc&&pc!=null)oc.textContent=money(n*per*pc/100,cur);
  }
});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape'&&!$('#layer').hidden)closeSheet();});

boot();
})();
</script>
